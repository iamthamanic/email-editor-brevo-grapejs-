<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head><title>Fixture</title></head>
<body>
<table class="nl2go-body-table" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;margin:0 auto;">
  <tr>
    <th width="100%" class="r1-i">
      <img src="https://img.mailinblue.com/logo.png" alt="Logo" width="120" />
    </th>
  </tr>
  <tr>
    <th width="100%" class="nl2go-default-textstyle r2-i">
      <div><p>Hallo {{ params.anrede }} {{ params.vorname }},</p></div>
    </th>
  </tr>
  <tr>
    <th width="100%" class="nl2go-default-textstyle">
      <div><p>Ihre Bestellung {{ params.bestellnummer }} ist bestätigt.</p></div>
    </th>
  </tr>
  <tr>
    <th width="50%" class="nl2go-default-textstyle">Spalte A {{ params.stadt }}</th>
    <th width="50%" class="nl2go-default-textstyle">Spalte B</th>
  </tr>
  <tr>
    <th width="100%">
      <a href="https://example.com/order" style="background:#275073;color:#fff;padding:12px 24px;border-radius:4px;text-decoration:none;">Zur Bestellung</a>
    </th>
  </tr>
</table>
</body>
</html>
