# Project config for verify-ui and agent pipeline
# Generated by /project-setup — adjust navigation and paths as the product grows

appRoot: apps/editor

devCommand: npm run dev --workspace=apps/editor
devUrl: http://localhost:5173

checksCommand: npm run checks
e2eCommand: npm run test:e2e

styleguide: docs/UI_STYLEGUIDE.md
designDir: .qa/design
acceptanceDir: .qa/acceptance
evidenceDir: .qa/evidence

locale: de

# Secure-by-Default — written by @project-setup into AGENTS.md + .qa/edge-cases.md.
security:
  checklist: secure-by-default

# @typed-strict — programming languages (NOT UI locale). Planned stack: TypeScript monorepo.
typedStrict:
  languages:
    - typescript

# @test-gate — deterministic tools/scripts (no AI review).
testGate:
  profile: monorepo
  depthDefault: standard
  runner: scripts
  always:
    - typedStrict
    - secureByDefault
    - rgSecretsDiff
  never:
    - aiReview
    - explanationCheck
    - fallow
    - updateReadme
    - mutation
  packages:
    editor:
      root: apps/editor
      checks: [lint, typecheck, build]
    api:
      root: apps/api
      checks: [lint, typecheck, build]

viewports:
  - name: mobile
    width: 390
    height: 844
  - name: desktop
    width: 1280
    height: 720

# Main navigation labels for smoke tests — fill when UI routes exist
navigation: []
